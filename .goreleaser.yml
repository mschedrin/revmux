version: 2

release:
  name_template: Version {{ .Version }}

builds:
  - id: revmux
    main: ./app/revmux
    binary: revmux
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.revision={{.Tag}}-{{.ShortCommit}}-{{ trimsuffix (replace (replace .CommitDate "-" "") ":" "") "Z" }}

archives:
  - id: revmux
    ids:
      - revmux
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: revmux
    package_name: revmux
    ids:
      - revmux
    vendor: mschedrin
    homepage: https://github.com/mschedrin/revmux
    maintainer: mschedrin
    description: Supervised multi-agent code review with Claude, Codex and OpenCode
    license: MIT
    formats:
      - deb
      - rpm

# This fork has no Homebrew tap. Release artifacts stay in the current repository.
